base_locale: en
fallback_strategy: base_locale
input_directory: lib/i18n
input_file_pattern: .i18n.json
output_directory: lib/gen/i18n
output_file_name: strings.g.dart
string_interpolation: braces
# Deferred locales make setLocaleSync/useDeviceLocaleSync throw for non-base
# locales; the translation payload is tiny, so load all eagerly.
lazy: false
