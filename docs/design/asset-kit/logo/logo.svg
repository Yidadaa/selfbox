    <radialGradient id="bubble" cx=".18" cy=".08" r="1.05"><stop stop-color="#b5ffff"/><stop offset=".28" stop-color="#43ecf5"/><stop offset=".65" stop-color="#0cd9eb"/><stop offset="1" stop-color="#00e4ce"/></radialGradient>
    <linearGradient id="bubbleEdge" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#e4ffff" stop-opacity=".8"/><stop offset=".4" stop-color="#83ffff" stop-opacity=".2"/><stop offset="1" stop-color="#00c7c4" stop-opacity=".1"/></linearGradient>
    <radialGradient id="blush"><stop stop-color="#ffa88c" stop-opacity=".6"/><stop offset="1" stop-color="#ffad90" stop-opacity="0"/></radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#3b2923"/><stop offset="1" stop-color="#70503c"/></linearGradient>
    <radialGradient id="nose" cx=".32" cy=".2" r=".75"><stop stop-color="#bd9180"/><stop offset=".22" stop-color="#77574d"/><stop offset=".6" stop-color="#4a2c21"/><stop offset="1" stop-color="#2c1c18"/></radialGradient>
    <radialGradient id="star" cx=".35" cy=".3" r=".8"><stop stop-color="#fffca1"/><stop offset=".6" stop-color="#ffed54"/><stop offset="1" stop-color="#ffd12e"/></radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#674c38" flood-opacity=".21"/></filter>
