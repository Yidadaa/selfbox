targets:
  $default:
    sources:
      include:
        - lib/**
        - assets/**
        - pubspec.yaml
        - $package$
      exclude:
        - lib/**/__tests__/**
        # ObjectBox's checked-in model JSON is an input: excluding it resets UIDs.
        - lib/gen/**/*.dart
    builders:
      freezed:
        options:
          build_extensions:
            "^lib/{{}}.dart": "lib/gen/{{}}.freezed.dart"
      source_gen|combining_builder:
        options:
          build_extensions:
            "^lib/{{}}.dart": "lib/gen/{{}}.g.dart"
      json_serializable:
        options:
          # Nested freezed models must serialize to maps, not objects.
          explicit_to_json: true
